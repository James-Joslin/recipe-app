name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: C# API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: recipes_ci
      POSTGRES_USER: recipes_ci
      POSTGRES_PASSWORD: recipes_ci_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipes_ci
          POSTGRES_USER: recipes_ci
          POSTGRES_PASSWORD: recipes_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes_ci -d recipes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore .NET dependencies
        run: dotnet restore api.Tests/recipeApi.Tests.csproj
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migrations/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install --requirement migrations/requirements.txt
      - name: Apply PostgreSQL migrations
        working-directory: migrations
        run: alembic upgrade head
      - name: Verify .NET formatting
        run: |
          dotnet format api/recipeApi.csproj --no-restore --verify-no-changes
          dotnet format api.Tests/recipeApi.Tests.csproj --no-restore --verify-no-changes
      - name: Run Roslyn/.NET analyzers
        run: dotnet build api.Tests/recipeApi.Tests.csproj --configuration Release --no-restore --no-incremental --warnaserror -p:RunAnalyzers=true -p:EnableNETAnalyzers=true
      - name: Run tests
        run: dotnet test api.Tests/recipeApi.Tests.csproj --configuration Release --no-restore --no-build --verbosity normal

  python-quality:
    name: FastAPI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fastapi
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fastapi/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q

  frontend-quality:
    name: Next.js quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify Prettier formatting
        run: npm run format:check
      - name: Run frontend lint
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  migration-round-trip:
    name: PostgreSQL migration upgrade and downgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: migrations
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: recipes_ci
      POSTGRES_USER: recipes_ci
      POSTGRES_PASSWORD: recipes_ci_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipes_ci
          POSTGRES_USER: recipes_ci
          POSTGRES_PASSWORD: recipes_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes_ci -d recipes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migrations/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Re-upgrade to head
        run: alembic upgrade head

  neo4j-migration-check:
    name: Neo4j migration idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEO4J_HOST: 127.0.0.1
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: recipes_ci_password
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/recipes_ci_password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --quiet --spider http://127.0.0.1:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: neo4j-migrations/requirements.txt
      - name: Install migration dependencies
        working-directory: neo4j-migrations
        run: python -m pip install --requirement requirements.txt
      - name: Apply migrations
        working-directory: neo4j-migrations
        run: python migrate.py
      - name: Re-run migrations idempotently
        working-directory: neo4j-migrations
        run: python migrate.py

  production-images:
    name: Production image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: fastapi
            context: ./fastapi
            dockerfile: ./fastapi/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: migrations
            context: ./migrations
            dockerfile: ./migrations/Dockerfile
          - image: neo4j-migrations
            context: ./neo4j-migrations
            dockerfile: ./neo4j-migrations/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-validation:
    name: Compose and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate development Compose configuration
        run: docker compose --env-file .env.dev.example --file compose.dev.yml config --quiet
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.prod.example --file compose.prod.yml config --quiet

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan repository
        run: semgrep scan --config auto --error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - javascript-typescript
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674feb5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-tests
      - python-quality
      - frontend-quality
      - migration-round-trip
      - neo4j-migration-check
      - production-images
      - compose-validation
      - semgrep
      - codeql
    steps:
      - name: Verify every required CI job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

