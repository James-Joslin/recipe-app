name: recipe-app-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-recipes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-recipes_dev_password}
    ports:
      - "${NEO4J_HOST_HTTP_PORT:-7475}:7474"
      - "${NEO4J_HOST_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_dev_data:/data
      - neo4j_dev_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  migrations:
    build:
      context: ./migrations
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-recipes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_dev_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["upgrade", "head"]
    restart: "no"

  neo4j-migrations:
    build:
      context: ./neo4j-migrations
      dockerfile: Dockerfile.dev
    environment:
      NEO4J_HOST: ${NEO4J_HOST:-neo4j}
      NEO4J_BOLT_PORT: ${NEO4J_BOLT_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-recipes_dev_password}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j-migrations:/migrations
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-recipes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_dev_password}
    ports:
      - "${API_PORT:-5154}:8080"
    volumes:
      - ./api:/src
      - ./api:/repo/api
      - ./api.Tests:/repo/api.Tests
      - api_nuget_cache:/root/.nuget/packages
    depends_on:
      migrations:
        condition: service_completed_successfully
      neo4j-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-recipes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_dev_password}
    ports:
      - "${FASTAPI_PORT:-8001}:8000"
    volumes:
      - ./fastapi:/app
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      RECIPE_API_URL: http://api:8080
      NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://localhost:8001}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_dev_data:
  neo4j_dev_data:
  neo4j_dev_logs:
  api_nuget_cache:
  frontend_node_modules:
  frontend_next:

